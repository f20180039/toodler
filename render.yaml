# Render Blueprint — the Round 2 prototype, as a static site.
#
# Committed rather than configured in the dashboard so the deploy is
# reproducible and reviewable: what is serving the demo is whatever this file
# says, and a change to it is a change in the diff.
#
# There is no server. `npm run build` typechecks and emits dist/, which Render
# serves directly — consistent with the prototype executing nothing (docs/07).

services:
  - type: web
    name: toddle-admissions-prototype
    runtime: static
    # `npm ci` rather than `npm install`: it installs exactly the lockfile, so
    # the deployed bundle matches what was built and verified locally.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Vite 5 supports Node 18/20/22. Pinned so a Render default bump cannot
      # silently change the build.
      - key: NODE_VERSION
        value: "20"

    # Only rebuild when something that affects the bundle changes.
    #
    # This is the point of hosting it here: once the real backend and frontend
    # start landing in this repo, work on them must not redeploy the prototype.
    # Adding a backend/ directory, a Dockerfile or CI config touches nothing
    # below, so the demo URL keeps serving the build it already has.
    buildFilter:
      paths:
        - src/**
        - index.html
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig.json
        - render.yaml

    # The app keeps its state in the query string (?flow=…&step=…) and never
    # changes the path, so this is insurance rather than a requirement: any
    # stray path still lands on the app instead of a 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Vite content-hashes these filenames, so a given URL's bytes never
      # change and it is safe to cache them indefinitely.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
